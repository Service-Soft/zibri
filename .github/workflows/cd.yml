name: CD
on:
    pull_request:
        types: [closed]
        branches: [release]

permissions:
    id-token: write  # Required for OIDC
    contents: read
    pages: write      # to deploy to Pages

jobs:
    deploy:
        if: github.event.pull_request.merged
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                ref: release
            - uses: actions/setup-node@v4
              with:
                node-version: '22'
                registry-url: 'https://registry.npmjs.org'
            # Ensure npm 11.5.1 or later is installed
            - run: npm install -g npm@latest
            - run: npm i
            # zibri-tsx first: zibri type checks against its built dist and depends on it as a peer.
            - run: npm run build -w zibri-tsx
            - run: npm publish -w zibri-tsx
            - run: npm run build:prod -w zibri
            - run: npm publish -w zibri
            - run: npm run build -w cli
            - run: npm publish -w cli

    updateDocs:
        if: github.event.pull_request.merged
        # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                ref: release
            - uses: actions/setup-node@v4
              with:
                node-version: '22'
            - run: npm ci
            - run: npm run build -w zibri-tsx
            - run: npm run build:prod -w zibri
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                path: packages/zibri/docs/generated
            - uses: actions/deploy-pages@v4