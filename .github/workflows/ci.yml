name: CI
on:
    push:
        branches-ignore: [release]

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: '22'
            - run: npm ci
            - run: npm run build:prod -w zibri
            - run: npm run lint
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: '22'
            - name: install PostgreSQL 17
              run: |
                sudo apt-get update
                sudo apt-get install -y postgresql-common ca-certificates curl
                printf '\n' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
                sudo apt-get update
                sudo apt-get install -y postgresql-client-17
            - run: npm ci
            - run: npm run build:prod -w zibri
            - run: npm run test:ci -w zibri
            - uses: codecov/codecov-action@v5
              with:
                token: ${{ secrets.CODECOV_TOKEN }}
                files: packages/zibri/src/__testing__/coverage/report/lcov.info
                fail_ci_if_error: true